name: Verify

on:
  push:
    branches:
      - "**"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: ga

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          cache-dependency-path: Frontend/pnpm-lock.yaml
          package-json-file: Frontend/package.json
          install: false

      - name: Install frontend dependencies
        run: pnpm --dir Frontend install --frozen-lockfile

      - name: Verify frontend
        run: pnpm --dir Frontend verify

      - name: Restore library solution
        run: dotnet restore Library/AskARabbiLIB.slnx

      - name: Restore prototype solution
        run: dotnet restore Prototype/AskARabbiPrototype.slnx

      - name: Restore backend solution
        run: dotnet restore Backend/AskARabbiBackend.slnx

      - name: Restore corpus tools
        run: dotnet restore Tools/AskARabbi.Tools.slnx

      - name: Build library and tests
        run: dotnet build Library/AskARabbiLIB.slnx --configuration Release --no-restore

      - name: Build prototype
        run: dotnet build Prototype/AskARabbiPrototype.slnx --configuration Release --no-restore

      - name: Build backend and tests
        run: dotnet build Backend/AskARabbiBackend.slnx --configuration Release --no-restore

      - name: Build corpus tools
        run: dotnet build Tools/AskARabbi.Tools.slnx --configuration Release --no-restore

      - name: Run library tests
        run: dotnet test Library/AskARabbiLIB.slnx --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=verification.trx" --results-directory Library/TestResults/Verification

      - name: Run backend tests
        run: dotnet test Backend/AskARabbiBackend.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=backend-verification.trx" --results-directory Backend/TestResults/Verification

      - name: Enforce library branch coverage
        run: python3 scripts/check-cobertura-coverage.py Library/TestResults/Verification --minimum-branch-rate 80

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Library/TestResults/Verification/**
            Backend/TestResults/Verification/**
          if-no-files-found: warn
          retention-days: 14

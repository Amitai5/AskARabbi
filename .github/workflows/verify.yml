name: Verify

on:
  push:
    branches:
      - "**"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: ga

      - name: Restore library solution
        run: dotnet restore Library/AskARabbiLIB.slnx

      - name: Restore prototype solution
        run: dotnet restore Prototype/AskARabbiPrototype.slnx

      - name: Build library and tests
        run: dotnet build Library/AskARabbiLIB.slnx --configuration Release --no-restore

      - name: Build prototype
        run: dotnet build Prototype/AskARabbiPrototype.slnx --configuration Release --no-restore

      - name: Run library tests
        run: dotnet test Library/AskARabbiLIB.slnx --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" --logger "trx;LogFileName=verification.trx" --results-directory Library/TestResults/Verification

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: Library/TestResults/Verification/**
          if-no-files-found: warn
          retention-days: 14
